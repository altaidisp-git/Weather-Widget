<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода Алтай — Исправленный виджет</title>
    <style>
        /* ==========================================
           1. КОМПАКТНЫЕ СТИЛИ (ФИКС ОШИБОК ВЕРСТКИ)
           ========================================== */
        html, body {
            margin: 0;
            padding: 0;
            width: 384px; /* Жесткая ширина экрана */
            height: 100%;
            overflow: hidden;
            background-color: #205473; /* Фирменный сине-серый фон */
            font-family: 'Arial', 'Helvetica', sans-serif;
            color: #ffffff;
            box-sizing: border-box;
        }

        .widget-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* --- ВЕРХНЯЯ ЧАСТЬ --- */
        .current-weather {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px 10px 15px; /* Уменьшили отступы */
            box-sizing: border-box;
            width: 100%;
        }

        .location-block {
            flex: 1.2;
            max-width: 140px; /* Ограничение, чтобы не двигать иконку */
        }

        .city-name {
            font-size: 26px; /* Оптимизировано */
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .sub-label {
            font-size: 16px; /* Уменьшено */
            font-weight: bold;
            opacity: 0.8;
            text-transform: uppercase;
            margin-top: 1px;
        }

        /* Центральная иконка */
        #current-icon-box {
            flex: 0.8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Блок температуры справа */
        .temp-block {
            flex: 1.2;
            text-align: right;
            max-width: 140px;
        }

        .current-temp {
            font-size: 52px; /* Уменьшено, чтобы цифры не вылезали за экран */
            font-weight: bold;
            line-height: 1;
        }

        .current-status {
            font-size: 13px; /* Сделано компактнее */
            opacity: 0.9;
            line-height: 1.2;
            margin-top: 2px;
        }

        /* --- НИЖНЯЯ ЧАСТЬ (ПРОГНОЗ) --- */
        .forecast-container {
            display: flex;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 0; /* Сузили подвал */
            box-sizing: border-box;
        }

        .forecast-day {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .day-name {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .day-temp {
            font-size: 15px;
            font-weight: bold;
            color: #ff8a75;
            margin-top: 8px;
            margin-bottom: 1px;
        }

        .night-temp {
            font-size: 13px;
            font-weight: bold;
            color: #a5cce6;
        }

        /* --- РАЗМЕРЫ ИКОНОК (SVG) --- */
        .icon-svg {
            width: 48px;  /* Уменьшено с 60px */
            height: 48px;
            fill: none;
            stroke: #e0e0e0;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .forecast-container .icon-svg {
            width: 26px;  /* Уменьшено с 34px */
            height: 26px;
            stroke-width: 3.5;
        }
    </style>
</head>
<body>

    <div class="widget-wrapper">
        
        <!-- ВЕРХ: ТЕКУЩАЯ ПОГОДА -->
        <div class="current-weather">
            <div class="location-block">
                <div class="city-name">Алтай</div>
                <div class="sub-label">Погода</div>
            </div>
            
            <div id="current-icon-box">
                <!-- Сюда вставится SVG иконка -->
            </div>
            
            <div class="temp-block">
                <div class="current-temp" id="current-temp">--°C</div>
                <div class="current-status" id="current-status">...</div>
            </div>
        </div>

        <!-- НИЗ: ПРОГНОЗ НА 5 ДНЕЙ -->
        <div class="forecast-container" id="forecast-box">
            <!-- Сюда сгенерируются 5 колонок -->
        </div>

    </div>

    <!-- ==========================================
       2. СКРИПТ (БЕЗ ИЗМЕНЕНИЙ В ЛОГИКЕ)
       ========================================== -->
    <script>
        const lat = 49.73;
        const lon = 84.27;
        const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;

        const daysOfWeek = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];

        const weatherStatuses = {
            0: "ясно", 1: "преимущ. ясно", 2: "облачно", 3: "пасмурно",
            45: "туман", 48: "изморозь", 51: "морось", 53: "морось", 55: "морось",
            61: "неб. дождь", 63: "дождь", 65: "сил. дождь", 71: "неб. снег",
            73: "снегопад", 75: "снегопад", 80: "ливень", 81: "ливень",
            82: "сил. ливень", 85: "снег", 86: "снегопад", 95: "гроза"
        };

        const iconsSvg = {
            clear: `<svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`,
            cloudy: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 15h9a5 5 0 0 0 0-10z"/></svg>`,
            rain: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M16 13v8M12 15v6M8 13v8M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>`,
            snow: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25M8 16h.01M12 16h.01M16 16h.01M12 19h.01"/></svg>`,
            thunder: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 8.58M13 11l-4 6h6l-4 6"/></svg>`
        };

        function getIconByCode(code) {
            if ([0, 1].includes(code)) return iconsSvg.clear;
            if ([2, 3, 45, 48].includes(code)) return iconsSvg.cloudy;
            if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return iconsSvg.rain;
            if ([71, 73, 75, 77, 85, 86].includes(code)) return iconsSvg.snow;
            if ([95, 96, 99].includes(code)) return iconsSvg.thunder;
            return iconsSvg.cloudy;
        }

        async function updateWeather() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                const currentTemp = Math.round(data.current.temperature_2m);
                const currentCode = data.current.weather_code;
                
                document.getElementById('current-temp').innerText = `${currentTemp}°C`;
                document.getElementById('current-status').innerText = weatherStatuses[currentCode] || "облачно";
                document.getElementById('current-icon-box').innerHTML = getIconByCode(currentCode);

                const forecastBox = document.getElementById('forecast-box');
                forecastBox.innerHTML = '';

                for (let i = 0; i < 5; i++) {
                    const date = new Date(data.daily.time[i]);
                    const dayName = daysOfWeek[date.getDay()];
                    const maxTemp = Math.round(data.daily.temperature_2m_max[i]);
                    const minTemp = Math.round(data.daily.temperature_2m_min[i]);
                    const dayCode = data.daily.weather_code[i];

                    const dayElement = document.createElement('div');
                    dayElement.className = 'forecast-day';
                    
                    dayElement.innerHTML = `
                        <div class="day-name">${dayName}</div>
                        ${getIconByCode(dayCode)}
                        <div class="day-temp">${maxTemp}°</div>
                        <div class="night-temp">${minTemp}°</div>
                    `;
                    forecastBox.appendChild(dayElement);
                }

            } catch (error) {
                console.error("Ошибка обновления:", error);
                document.getElementById('current-status').innerText = "ошибка";
            }
        }

        updateWeather();
        setInterval(updateWeather, 15 * 60 * 1000);
    </script>
</body>
</html>
